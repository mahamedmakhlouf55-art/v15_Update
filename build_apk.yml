name: Build Celyah V14 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android wrapper
        run: flutter create --org com.celyah --project-name celyah --platforms=android app_build
      - name: Copy source
        run: |
          rm -rf app_build/lib
          cp -r lib app_build/lib
          cp pubspec.yaml app_build/pubspec.yaml
          cp -r assets app_build/assets
      - name: Install branded Android launcher icon and native splash
        run: |
          python3 -m pip install Pillow
          python3 tools/install_branding.py
      - name: Configure permissions
        run: python3 tools/patch_manifest.py
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" || true
      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app_build/android/app/build.gradle.kts')
          if p.exists():
              s=p.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 37')
              p.write_text(s)
          else:
              p=Path('app_build/android/app/build.gradle')
              if p.exists():
                  s=p.read_text().replace('compileSdk flutter.compileSdkVersion','compileSdk 37')
                  p.write_text(s)
          PY
      - name: Build
        working-directory: app_build
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Celyah-V14-Branded-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
